main{max-width:960px;padding-top:26px}.intro{max-width:660px;margin:auto}.playhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.steps{display:flex;gap:8px;margin:0 0 30px}.steps span{height:5px;background:#dce3f0;flex:1;border-radius:5px}.steps span.done{background:var(--blue)}.postgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.post{margin:0;padding:20px;text-align:left;background:white;border:2px solid var(--line);border-radius:14px;color:var(--ink);display:flex;flex-direction:column;gap:10px}.post.chosen{border-color:var(--blue);background:#edf2ff}.post h3{min-height:48px}.post .metrics{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:16px;margin-top:auto}.metrics strong{display:block;font-size:29px;line-height:1.2}.metrics span{font-size:14px;color:var(--muted)}.postlabel{font-size:13px;letter-spacing:1px;font-weight:800;color:var(--blue)}.goalstrip{background:var(--navy);color:white;padding:17px 20px;border-radius:10px;margin:18px 0}.goalstrip span{color:var(--lime);font-size:13px;font-weight:750;letter-spacing:1px;margin-right:10px}.questionchoices{display:grid;gap:12px}.answerbtn{text-align:left;padding:18px;border:2px solid var(--line);border-radius:10px;background:white;font-weight:550;color:var(--ink)}.answerbtn.chosen{border-color:var(--blue);background:#edf2ff}.answerbtn:disabled,.post:disabled{opacity:1}.explain{margin-top:22px;background:#edf2ff;border-left:4px solid var(--blue);padding:18px;border-radius:3px}.explain.correct{background:#eef8e8;border-color:#447d2f}.summaryrow{border-top:1px solid var(--line);padding:18px 0}.summaryrow:last-child{padding-bottom:0}.summaryrow small{display:block;color:var(--blue);font-size:13px;font-weight:800;letter-spacing:1px;margin-bottom:7px}.textlink{background:transparent;border:0;color:var(--muted);padding:8px;font-size:14px}.resulticon{width:48px;height:48px;background:var(--lime);border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;margin-bottom:18px}#notice{margin:10px 0;color:#a02d3b}.instruct{margin:35px auto 0;max-width:660px;font-size:14px;color:var(--muted)}@media(max-width:650px){.postgrid{grid-template-columns:1fr}.post h3{min-height:0}.post .metrics{grid-template-columns:1fr 1fr}.playhead{align-items:flex-start}h1{font-size:30px}}@media print{.playhead,.steps,.instruct{display:none}.summaryrow{break-inside:avoid}}

.print-only{display:none}@media print{.print-only{display:block;border-bottom:1px solid #aaa;margin-bottom:16px;padding-bottom:12px}.intro{max-width:none}.no-print{display:none!important}body{font-size:12px}h1{font-size:25px}.card{padding:14px;margin:12px 0}} </style><body><header><div><div class="brand">social<span>/</span>manager lab</div><div class="course">PRE 3600 Social Media for PR <span>/ Sept 29, 2026</span></div></div><button class="headerbtn no-print" onclick="toggleGroups()" id="groupToggle">Random groups</button></header><main id="app" aria-live="polite"></main><script>
const cases={
cafe:{name:'Third Place Café',type:'Local café',intro:'Your café gets plenty of likes, but weekday afternoons are quiet.',mission:'Bring more customers in between 2 and 5 p.m. this week.',metric:'Offer redemptions',metricShort:'Offer uses',definition:'An offer use means a customer completed a purchase using that post’s afternoon offer code.',goalChoices:['Get the most likes.','Get more completed afternoon purchases using the offer.','Publish as many posts as possible.'],goalAnswer:1,goalWhy:'The café needs afternoon customers. Completed offer purchases are more directly connected to that goal than likes.',goalHint:'Think about what happens inside the café, after someone sees the post.',posts:[{name:'Coffee-life meme',format:'Funny reel',likes:4200,actions:8},{name:'Afternoon menu demo',format:'Short menu video',likes:640,actions:40},{name:'Offer reminder',format:'Story with offer code',likes:140,actions:30}],auditWhy:'The menu demo generated 40 tracked offer uses, the most of these three posts. The meme had more likes, but only 8 offer uses.',auditHint:'Compare offer uses. Which post is linked to the most completed purchases?',nextChoices:['Make only memes because they get the most likes.','Stop posting because likes do not matter.','Test another menu demo with the afternoon offer, then check completed offer purchases.'],nextAnswer:2,nextWhy:'Use the strongest observed result as a starting point for a small test. Check whether the next post produces the action you want.',nextHint:'Choose the plan that uses these results and checks what happens next.',limit:'An offer use is not necessarily an extra sale. Check discounts and product costs before claiming profit.',sample:'I would test another menu demo because it generated 40 offer uses, then check completed afternoon offer purchases.'},
shelter:{name:'Second Chance Shelter',type:'Animal shelter',intro:'People share the shelter’s posts, but few attend a meet-and-greet.',mission:'Help more prospective adopters attend a meet-and-greet this week.',metric:'Completed visits',metricShort:'Visits',definition:'A visit means a household attended a booked meet-and-greet. Canceled appointments and no-shows are excluded.',goalChoices:['Get more completed meet-and-greet visits.','Get the most comments saying “cute.”','Promise that every animal will be adopted.'],goalAnswer:0,goalWhy:'An attended visit is directly connected to the shelter’s goal. A like or a booking does not establish that someone attended.',goalHint:'Look for the action the shelter wants people to complete.',posts:[{name:'Cute animal compilation',format:'Funny reel',likes:7000,actions:3},{name:'Meet Luna',format:'Care needs and daily routine',likes:900,actions:12},{name:'Appointment guide',format:'Story with booking link',likes:160,actions:10}],auditWhy:'Luna’s profile generated 12 tracked visits, the most of these three posts. The compilation had 7,000 likes but only 3 visits.',auditHint:'Compare completed visits, not likes or shares.',nextChoices:['Test another honest animal profile with care needs and a booking link, then track attended visits.','Post only cute compilations because they get more likes.','Promise everyone an immediate adoption to increase clicks.'],nextAnswer:0,nextWhy:'An informative profile can support an informed visit. Track attendance and keep care requirements accurate; a visit does not guarantee an adoption.',nextHint:'Use the post that supported visits, while giving people honest information.',limit:'A completed visit is not an adoption or proof of a suitable match. Never pressure someone to adopt.',sample:'I would test another care-needs profile because Luna’s generated 12 visits, then track attended meet-and-greets.'},
creator:{name:'Alex Creates',type:'Student creator',intro:'Alex wants an honest work sample for a future brand partnership.',mission:'Get more people to request Alex’s campus savings guide this week.',metric:'Valid guide requests',metricShort:'Guide requests',definition:'A request means a person opted in to receive the guide. Duplicate and invalid submissions are excluded.',goalChoices:['Claim that every follower will buy from a sponsor.','Use the highest view count as proof of sales.','Get more valid requests for the savings guide.'],goalAnswer:2,goalWhy:'Guide requests are a clear action Alex can measure and report. They do not prove purchases or guarantee a brand partnership.',goalHint:'Choose a real action Alex can count without making unsupported promises.',posts:[{name:'Campus trend remix',format:'Trend reel',likes:5400,actions:6},{name:'Budget routine walkthrough',format:'Practical how-to reel',likes:1100,actions:30},{name:'Guide FAQ',format:'Story with request link',likes:200,actions:25}],auditWhy:'The budget routine generated 30 valid requests, the most of these three posts. The trend remix had more likes, but only 6 requests.',auditHint:'Compare valid guide requests. Which post produced the largest count?',nextChoices:['Promise a sponsor guaranteed sales based on the trend reel.','Test another practical budget routine with the guide link, then count valid requests.','Report likes as if they were purchases.'],nextAnswer:1,nextWhy:'Test content connected to the desired action, then report what was actually measured. A future media kit can use those results with their definitions.',nextHint:'Choose an action you can measure and describe accurately.',limit:'Guide requests are not purchases or proof of audience fit. A media kit needs relevant audience information too.',sample:'I would test another budget routine because it generated 30 valid requests, then count requests from the new post.'}
};

const campaignCosts={cafe:[160,200,60],shelter:[180,240,100],creator:[120,150,50]};
Object.entries(cases).forEach(([id,c])=>{c.posts.forEach((p,i)=>p.cost=campaignCosts[id][i]);c.strategies=[`Test another ${c.posts[1].name.toLowerCase()} to build on the highest total outcome.`,`Test another ${c.posts[2].name.toLowerCase()} to explore the lowest observed cost per outcome.`,`Split a small test between ${c.posts[1].name.toLowerCase()} and ${c.posts[2].name.toLowerCase()}.`];c.strategyFeedback=['You are prioritizing the largest observed total. Explain why that is worth the higher cost per outcome, and how you will limit the test budget.','You are prioritizing observed efficiency. Explain why a smaller total is acceptable, and why a low historical cost may not hold with more spending.','You are learning before choosing one approach. Explain how splitting a small budget might leave too little data, and how you will make the comparison fair.'];});
let submission={group:'',members:''};
let groupMode=false;let groupState={roster:'',groups:[],error:''};
let state={client:null,step:0,pick:null,checked:false,correct:false,answers:[],note:'',measure:'',auditRound:0,showMath:false};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toggleGroups(){groupMode=!groupMode;render();topPage()}
function rosterNames(raw){return raw.split(/[\n,]+/).map(n=>n.trim()).filter(Boolean)}
function randomBelow(n){const buf=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%n}
function assignBalanced(names){const shuffled=[...names];for(let i=shuffled.length-1;i>0;i--){const j=randomBelow(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const groups=[[],[],[]];shuffled.forEach((name,i)=>groups[i%3].push(name));return groups}
function makeGroups(){const names=rosterNames(groupState.roster);if(names.length<3){groupState.error='Enter at least three names, one per line.';render();return}const seen=new Set();for(const name of names){const key=name.toLocaleLowerCase();if(seen.has(key)){groupState.error='Repeated name: '+name+'. If these are different students, add a last initial or another identifier.';render();return}seen.add(key)}if(groupState.groups.length&&!confirm('Reshuffle all students into new groups?'))return;groupState.groups=assignBalanced(names);groupState.error='';render()}
function clearGroups(){if((groupState.roster||groupState.groups.length)&&!confirm('Clear the names and group assignments from this tab?'))return;groupState={roster:'',groups:[],error:''};render()}
function openGroupClient(id){if(state.client&&state.step>1&&!confirm('Open this client and clear the current activity draft? Group assignments will stay available.'))return;groupMode=false;chooseClient(id)}
function renderGroups(){const ids=['cafe','shelter','creator'];$('app').innerHTML=`<div class="groupinstructions"><div class="eyebrow">Classroom setup</div><h1>Three groups. Three clients.</h1><p class="muted">Paste the students who are here today. Each student goes into one group; group sizes differ by no more than one.</p></div><div class="groupform card"><label for="roster">Student names</label><p class="tiny muted">One name per line, or separated by commas. Use last initials when first names repeat.</p><textarea id="roster" rows="8" spellcheck="false" autocomplete="off" placeholder="Alex R.\nJordan K.\nTaylor M." oninput="groupState.roster=this.value">${esc(groupState.roster)}</textarea><div class="actions"><button class="primary" onclick="makeGroups()">${groupState.groups.length?'Reshuffle groups':'Assign three groups'}</button><button class="secondary" onclick="clearGroups()">Clear names</button></div><p class="bad tiny" role="alert" style="margin-top:12px">${esc(groupState.error)}</p><p class="tiny muted">Names are processed only in this tab. They are not uploaded, saved, or included in activity reports. Refreshing or closing clears them. Editing the list does not change existing groups until you reshuffle.</p></div>${groupState.groups.length?`<div class="groupcourse">PRE 3600 Social Media for PR / Sept 29, 2026<br>${groupState.groups.flat().length} students · ${groupState.groups.map(g=>g.length).join(' / ')} per group</div><div class="groupresults">${groupState.groups.map((names,i)=>`<section class="groupcard"><span class="badge">GROUP ${i+1} · ${names.length} students</span><h2>${cases[ids[i]].type}</h2><p class="muted tiny">${cases[ids[i]].name}</p><ol>${names.map(name=>`<li>${esc(name)}</li>`).join('')}</ol><button class="secondary no-print" onclick="openGroupClient('${ids[i]}')">Open this client</button></section>`).join('')}</div><div class="actions no-print"><button class="primary" onclick="window.print()">Print / Save group list</button><button class="secondary" onclick="toggleGroups()">Back to activity</button></div><p class="tiny muted no-print">Display these assignments to the class. Each group opens its assigned client in the activity; assignments are not sent to students automatically.</p>`:''}`;}
function current(){return cases[state.client]}
function chooseClient(id){if(!cases[id])throw Error('Unknown client');submission={group:'',members:''};state={client:id,step:1,pick:null,checked:false,correct:false,answers:[],note:'',measure:'',auditRound:0,showMath:false};render();topPage()}
function topPage(){window.scrollTo({top:0,behavior:'smooth'})}
function choose(i){if(state.correct)return;state.pick=i;state.checked=false;render()}
function check(){if(state.step===3){if(state.pick===null){$('notice').textContent='Choose a strategy.';return}if(state.note.trim().length<40||state.measure.trim().length<20){$('notice').textContent='Add your evidence and trade-off (40+ characters), and a measurement plan (20+ characters).';return}state.answers[3]=state.pick;state.step=4;render();topPage();return}if(state.pick===null){$('notice').textContent='Choose one answer first.';return}const c=current();const correct=state.step===1?c.goalAnswer:state.step===2?(state.auditRound===0?1:2):c.nextAnswer;state.checked=true;state.correct=state.pick===correct;if(state.correct)state.answers[state.step===2?1+state.auditRound:0]=state.pick;render()}
function next(){if(!state.correct)return;if(state.step===2&&state.auditRound===0){state.auditRound=1}else{state.step++}state.pick=null;state.checked=false;state.correct=false;render();topPage()}
function restart(){if(state.step<4&&state.step>1&&!confirm('Choose a different client and clear this round?'))return;state={client:null,step:0,pick:null,checked:false,correct:false,answers:[],note:'',measure:'',auditRound:0,showMath:false};render();topPage()}
function controls(){const c=current();const efficiency=state.step===2&&state.auditRound===1;const correctText=efficiency?`Post C cost $${c.posts[2].cost} ÷ ${c.posts[2].actions} = $${(c.posts[2].cost/c.posts[2].actions).toFixed(2)} per outcome. Post B cost $${(c.posts[1].cost/c.posts[1].actions).toFixed(2)}. B had more total outcomes; C had the lower observed cost per outcome. Neither proves what will happen if you spend more.`:c[state.step===1?'goalWhy':'auditWhy'];const hint=efficiency?'Divide each post’s cost by its completed outcomes. A smaller cost per outcome means higher observed efficiency.':c[state.step===1?'goalHint':'auditHint'];return `${state.checked?`<div class="explain ${state.correct?'correct':''}"><strong>${state.correct?'Supported by these data.':'Recheck the evidence.'}</strong><p style="margin:7px 0 0">${state.correct?correctText:hint}</p></div>`:''}<div class="actions">${state.correct?`<button class="primary" onclick="next()">${state.step===2&&state.auditRound===0?'Now consider the cost':'Next step'}</button>`:`<button class="primary" onclick="check()">Check my choice</button><span class="muted tiny">Agree on a reason before choosing.</span>`}</div><p id="notice" role="alert"></p>`}
function choices(list){return `<div class="questionchoices">${list.map((v,i)=>`<button class="answerbtn ${state.pick===i?'chosen':''}" aria-pressed="${state.pick===i}" onclick="choose(${i})" ${state.correct?'disabled':''}>${v}</button>`).join('')}</div>`}
function render(){document.getElementById('groupToggle').textContent=groupMode?'Back to activity':'Random groups';if(groupMode){renderGroups();return}let h='';if(!state.client){h=`<div class="intro"><div class="eyebrow">20–25 minutes · Three client groups</div><h1>One client.<br>A decision to defend.</h1><p class="muted">Choose a goal, compare results and costs, then defend a strategy. The data questions have answers. Your final recommendation needs evidence.</p><h2 style="margin-top:28px">Pick your client</h2><div class="questionchoices">${Object.entries(cases).map(([id,c])=>`<button class="answerbtn" onclick="chooseClient('${id}')"><span class="eyebrow">${c.type}</span><h3 style="margin:8px 0">${c.name}</h3><span class="muted" style="font-weight:400">${c.intro}</span></button>`).join('')}</div></div><details class="instruct"><summary>Instructor notes</summary><p>Use Random groups to split the class into three client groups. Students can first discuss in pairs within each group, then agree on a recommendation. Goal: 2 minutes. Results and costs: 8 minutes. Strategy: 7 minutes. Compare recommendations: 5 minutes. No speed score.</p><p>Review the final plan for: accurate numerical evidence, an explicit trade-off, and a measurable follow-up. Accept different strategies when justified. Data questions allow retries; strategy writing is not automatically graded. Ask: Would you spend the whole budget on the cheapest option? What makes you uncertain?</p><p>All data are fictional. Reports stay on the device; students submit through the course’s normal system.</p></details>`;}else{const c=current();h=`<div class="playhead"><span class="badge">${c.name}</span><button class="textlink" onclick="restart()">Choose another client</button></div><div class="steps" aria-label="${Math.min(state.step,3)} of 3 steps">${[1,2,3].map(i=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}</div>`;
if(state.step<4){h+=`<div class="eyebrow">Step ${state.step} of 3 · ${['','The goal','The evidence','The next move'][state.step]}</div><h1>${['','What does success look like?',state.auditRound===0?'Which post helped most?':'Does your answer change with cost?','What would you try next?'][state.step]}</h1><div class="goalstrip"><span>CLIENT GOAL</span>${c.mission}</div>`;if(state.step===1)h+=`<p class="muted">Choose the result that best matches your client’s goal.</p>${choices(c.goalChoices)}`;if(state.step===2)h+=`<p class="muted">All three posts ran during the same two-week period. ${state.auditRound===0?`Choose the post with the most <strong>${c.metric.toLowerCase()}</strong>.`:`Funds are limited. Which post had the <strong>lowest campaign cost per ${c.metricShort.toLowerCase().replace(/s$/,'')}</strong>? Total outcomes and efficiency can point to different posts.`}</p><p class="tiny muted">${c.definition}</p><div class="postgrid">${c.posts.map((p,i)=>`<button class="post ${state.pick===i?'chosen':''}" onclick="choose(${i})" aria-pressed="${state.pick===i}" ${state.correct?'disabled':''}><span class="postlabel">POST ${['A','B','C'][i]}</span><h3>${p.name}</h3><span class="muted tiny">${p.format}</span><div class="metrics"><div><strong>${p.likes.toLocaleString()}</strong><span>Likes</span></div><div><strong>${p.actions}</strong><span>${c.metricShort}</span></div>${state.auditRound===1?`<div><strong>$${p.cost}</strong><span>Campaign cost</span></div>${state.showMath?`<div><strong>$${(p.cost/p.actions).toFixed(2)}</strong><span>Cost per outcome</span></div>`:''}`:''}</div></button>`).join('')}</div>`;if(state.step===2&&state.auditRound===1)h+=`<p class="tiny muted" style="margin-top:16px">Campaign cost includes production and promotion. Cost per outcome = campaign cost ÷ completed outcomes. These are past observations, not a prediction.</p><button class="secondary" onclick="state.showMath=!state.showMath;render()">${state.showMath?'Hide calculations':'Show calculations'}</button>`;
if(state.step===3)h+=`<p class="muted">Your client has <strong>$200 for a small next test</strong>. What would you try? More than one strategy can be defended.</p><div class="card"><strong>Evidence to use</strong><p style="margin:8px 0 0">Post B: ${c.posts[1].actions} ${c.metric.toLowerCase()}, $${(c.posts[1].cost/c.posts[1].actions).toFixed(2)} per outcome.<br>Post C: ${c.posts[2].actions} ${c.metric.toLowerCase()}, $${(c.posts[2].cost/c.posts[2].actions).toFixed(2)} per outcome.</p><p class="tiny muted" style="margin-top:10px">The $200 is a new test budget, including production and promotion. Adapt the scope; historical costs are not fixed purchase prices. Do not assume spending twice as much produces twice the results.</p></div>${choices(c.strategies)}${state.pick!==null?`<div class="explain"><strong>Your trade-off</strong><p style="margin:8px 0 0">${c.strategyFeedback[state.pick]}</p></div>`:''}<div class="card"><label for="note">Defend your decision in 2–3 sentences</label><p class="tiny muted">Use two numbers. Explain how you would use the $200 and what you give up or remain uncertain about. At least 40 characters.</p><textarea id="note" maxlength="1800" oninput="state.note=this.value">${esc(state.note)}</textarea><label for="measure" style="margin-top:18px">How will you know whether it worked?</label><p class="tiny muted">Name the outcome, where you will track it, and when you will check. At least 20 characters.</p><textarea id="measure" maxlength="1000" oninput="state.measure=this.value">${esc(state.measure)}</textarea></div><button class="primary" onclick="check()">Review my recommendation</button><p id="notice" role="alert"></p><p class="tiny muted">Your instructor reviews the reasoning. The app checks only that both fields are completed.</p>`;
else h+=controls();}
else h+=`<div class="intro"><div class="print-only" id="reportIdentity"></div><div class="resulticon" aria-hidden="true">✓</div><div class="eyebrow">Recommendation ready for discussion</div><h1>Same data.<br>Different priorities.</h1><p class="muted">Compare your recommendation with another team. What trade-off did they make?</p><div class="card"><div class="summaryrow"><small>01 / GOAL</small>${c.goalChoices[c.goalAnswer]}</div><div class="summaryrow"><small>02 / EVIDENCE</small>Post B generated the most outcomes: <strong>${c.posts[1].actions}</strong>.<br>Post C had the lowest observed cost: <strong>$${(c.posts[2].cost/c.posts[2].actions).toFixed(2)} per outcome</strong>.</div><div class="summaryrow"><small>03 / STRATEGY</small>${c.strategies[state.answers[3]]}</div></div><div class="card report"><h3>Your evidence and trade-off</h3><p>${esc(state.note)}</p><h3>Your measurement plan</h3><p>${esc(state.measure)}</p></div><div class="explain"><strong>A limit to acknowledge</strong><p style="margin:8px 0 0">Different audiences, timing, or promotion may explain the differences. These observations do not prove causation or predict the return on a new $200 test. ${c.limit}</p></div><div class="card"><h3>Discussion checklist</h3><ul><li>Are the two numbers accurate and relevant?</li><li>Is the $200 plan realistic, with a clear trade-off?</li><li>Does the measurement plan name an outcome, source, and check-in time?</li></ul><p class="tiny muted">Completing this activity is not an automatic grade for your strategy.</p></div><div class="card no-print"><h3>Save your PDF for Canvas</h3><label for="submitGroup">Group number or team name</label><input id="submitGroup" maxlength="80" value="${esc(submission.group)}" oninput="submission.group=this.value" placeholder="e.g., Group 1"><label for="submitMembers" style="margin-top:14px">Group members</label><input id="submitMembers" maxlength="600" value="${esc(submission.members)}" oninput="submission.members=this.value" placeholder="Enter all group members"><p class="tiny muted" style="margin-top:12px">Choose Print / Save PDF, select Save as PDF in the print window, and upload the saved file to Canvas. One submission per group.</p><p id="submitError" class="bad tiny" role="alert"></p></div><div class="actions"><button class="primary" onclick="printReport()">Print / Save PDF</button><button class="secondary" onclick="download()">Download text copy</button><button class="secondary" onclick="revise()">Revise strategy</button><button class="secondary" onclick="restart()">Try another client</button></div><p class="tiny muted no-print" style="margin-top:15px">Save your report as a PDF, then upload it to the Canvas assignment. One student submits for the group. This website does not submit to Canvas. Save before refreshing or closing this tab.</p></div>`;}
h+=`<div class="foot">PRE 3600 Social Media for PR / Sept 29, 2026 · Chapter 13 practice<br>Fictional clients and data. Entered names stay in this browser tab and are not sent to a server.</div>`;$('app').innerHTML=h;}
function revise(){state.step=3;state.pick=state.answers[3];state.correct=false;state.checked=false;render();topPage()}
function textReport(){const c=current();return `SOCIAL MANAGER LAB — CAMPAIGN DECISIONS
PRE 3600 Social Media for PR / Sept 29, 2026
Fictional classroom practice; strategy awaits instructor review.
Client: ${c.name}
Group: ${submission.group}
Members: ${submission.members}

GOAL
${c.goalChoices[c.goalAnswer]}

EVIDENCE
Post B: ${c.posts[1].actions} ${c.metric.toLowerCase()}, $${(c.posts[1].cost/c.posts[1].actions).toFixed(2)} per outcome.
Post C: ${c.posts[2].actions} ${c.metric.toLowerCase()}, $${(c.posts[2].cost/c.posts[2].actions).toFixed(2)} per outcome.

STRATEGY FOR A $200 TEST
${c.strategies[state.answers[3]]}

MY EVIDENCE AND TRADE-OFF
${state.note}

MEASUREMENT PLAN
${state.measure}

LIMITATIONS
Observed results do not establish causation or predict new spending outcomes. ${c.limit}
`}
function download(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([textReport()],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='Social_Manager_Takeaway.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function updatePrintIdentity(){if(state.step!==4||groupMode)return;const el=$('reportIdentity');if(el)el.innerHTML=`<p><strong>PRE 3600 Social Media for PR / Sept 29, 2026</strong><br><strong>Client:</strong> ${esc(current().name)}<br><strong>Group:</strong> ${esc(submission.group)}<br><strong>Members:</strong> ${esc(submission.members)}</p>`;}
function printReport(){if(!submission.group.trim()||!submission.members.trim()){$('submitError').textContent='Enter the group and member names before saving your PDF.';$('submitGroup').focus();return}updatePrintIdentity();window.print()}
window.addEventListener('beforeprint',updatePrintIdentity);
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_campaign_progress',description:'Read the selected beginner case, current step, and completed decisions.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('Expected an empty object');return {client:state.client?current().name:null,step:state.step,completedDecisions:state.answers.length}}})).catch(()=>{});}catch(e){}}
</script></body></html>
